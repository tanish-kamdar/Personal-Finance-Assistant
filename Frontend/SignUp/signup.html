<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <div id="signupForm" class="mt-5 signupform">
        <h2 class="text-center mb-4">Signup</h2>
        <form method="post" action="http://localhost:8080/signup">
            <div class="mb-3">
                
                <input type="email" class="form-control" id="signupEmail" placeholder="Email Address">
            </div>
            <div class="row g-3 mb-3">
                <div class="col">
                  <input type="text" class="form-control" placeholder="First name" aria-label="First name">
                </div>
                <div class="col">
                  <input type="text" class="form-control" placeholder="Last name" aria-label="Last name">
                </div>
              </div>
            <div class="mb-3">
                <input type="email" class="form-control" id="signupEmail" placeholder="Set Password">
            </div>
            <div class="mb-3">
                <input type="password" class="form-control" id="signupPassword" placeholder="Confirm Password">
            </div>
            <button type="button" class="btn btn-success w-100" >Signup</button>
        </form>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
